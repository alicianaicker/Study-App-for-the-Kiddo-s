<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Study Buddy – Fun Exam Helper</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Comic Neue', 'Comic Neue', 'Comic Sans MS', cursive, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #ffecd2 0%, #fcb69f 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .app-container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,240,0.95);
            border-radius: 70px 70px 70px 40px;
            padding: 20px 25px 35px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
        }
        h1 {
            font-size: 2.4rem;
            margin: 0 0 5px;
            color: #c4450c;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 span {
            background: #ffb347;
            font-size: 1.3rem;
            padding: 5px 15px;
            border-radius: 50px;
            color: white;
        }
        .tab-bar {
            display: flex;
            gap: 12px;
            margin: 20px 0 15px;
            flex-wrap: wrap;
        }
        .tab {
            background: #ffd89a;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            font-size: 1rem;
            color: #5a2a0c;
        }
        .tab.active {
            background: #f77f00;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .panel {
            display: none;
            animation: fade 0.3s ease;
        }
        .panel.active-panel {
            display: block;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .card {
            background: #fffaf2;
            border-radius: 48px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }
        input, textarea, button, select {
            border-radius: 60px;
            border: 2px solid #ffce9e;
            padding: 12px 18px;
            font-size: 1rem;
            width: 100%;
            margin: 8px 0;
            background: white;
        }
        button {
            background: #f39c12;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.97);}
        .exam-item, .revision-note {
            background: #fdebd0;
            margin: 12px 0;
            padding: 15px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .exam-info strong { color: #c4450c; font-size: 1.2rem;}
        .delete-btn {
            background: #e67e22;
            width: auto;
            padding: 8px 16px;
            font-size: 0.8rem;
        }
        .upload-area {
            border: 3px dashed #f7b05e;
            background: #fff5e8;
            text-align: center;
            padding: 18px;
            border-radius: 50px;
            margin: 10px 0;
        }
        .question-box {
            background: #ffefdb;
            padding: 18px;
            border-radius: 35px;
            margin-top: 15px;
            border-left: 12px solid #f77f00;
        }
        .flex-btns {
            display: flex;
            gap: 10px;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #a9662e;
            margin-top: 20px;
        }
        @media (max-width: 500px) {
            body { padding: 10px; }
            .app-container { padding: 15px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <h1>📚 Study Buddy <span>🎮 fun zone</span></h1>
    <div class="tab-bar">
        <button class="tab active" data-tab="exam">📅 Exam Timetable</button>
        <button class="tab" data-tab="upload">📤 Upload PDF/Image</button>
        <button class="tab" data-tab="quiz">🧠 Quiz Me + Notes</button>
    </div>

    <!-- EXAM TIMETABLE PANEL -->
    <div id="examPanel" class="panel active-panel">
        <div class="card">
            <h2>➕ Add exam</h2>
            <input type="text" id="subjectName" placeholder="Subject (e.g. Maths, Science)" autocomplete="off">
            <input type="date" id="examDate">
            <input type="time" id="examTime">
            <textarea rows="2" id="topicsList" placeholder="What to learn? e.g. Fractions, plants, spelling"></textarea>
            <button id="saveExamBtn">📌 Save exam</button>
        </div>
        <div class="card">
            <h2>📋 Your exams</h2>
            <div id="examList"></div>
        </div>
    </div>

    <!-- UPLOAD IMAGES/PDF PANEL -->
    <div id="uploadPanel" class="panel">
        <div class="card">
            <h2>📎 Add study material</h2>
            <div class="upload-area" id="dropzone">
                📂 Tap or drag PDF / Image here<br>
                <input type="file" id="fileInput" accept="image/*,application/pdf" multiple style="display:none;">
                <button id="chooseFileBtn" style="background:#ffb347; margin-top:10px;">📁 Choose file</button>
            </div>
            <div id="uploadedFilesList"></div>
            <button id="generateFromFilesBtn" style="background:#e67e22;">✨ Generate notes & questions from all files</button>
        </div>
        <div class="card">
            <h3>📖 Saved notes (auto from files)</h3>
            <div id="autoNotesList"></div>
        </div>
    </div>

    <!-- QUIZ + REVISION PANEL -->
    <div id="quizPanel" class="panel">
        <div class="card">
            <h2>🧪 Active recall fun</h2>
            <button id="generateRandomQuizBtn">🎲 Surprise quiz from your files!</button>
            <div id="quizDisplay" style="margin-top:20px;"></div>
        </div>
        <div class="card">
            <h2>📝 All revision notes & questions</h2>
            <div id="allRevisionContent"></div>
        </div>
    </div>
    <footer>⭐ Everything saved on YOUR device only. Add photos of worksheets → auto study help!</footer>
</div>

<script>
    // ----- LOCAL STORAGE KEYS -----
    let exams = JSON.parse(localStorage.getItem('study_exams')) || [];
    let uploadedFilesMeta = JSON.parse(localStorage.getItem('study_files')) || []; // store name + type + dataURL (small)
    let revisionItems = JSON.parse(localStorage.getItem('study_revision_notes')) || []; // {text, type:"question/note", sourceFile}

    // helper saves
    function saveAll() {
        localStorage.setItem('study_exams', JSON.stringify(exams));
        localStorage.setItem('study_files', JSON.stringify(uploadedFilesMeta));
        localStorage.setItem('study_revision_notes', JSON.stringify(revisionItems));
        renderExamList();
        renderUploadedFiles();
        renderAutoNotesAndQuestions();
        renderAllRevisionContent();
    }

    // ----- RENDER EXAMS -----
    function renderExamList() {
        const container = document.getElementById('examList');
        if(!container) return;
        if(exams.length === 0) {
            container.innerHTML = '<div class="exam-item">🎯 No exams yet. Add your first exam!</div>';
            return;
        }
        container.innerHTML = exams.map((exam, idx) => `
            <div class="exam-item">
                <div><strong>${escapeHtml(exam.subject)}</strong><br>
                📅 ${exam.date || 'No date'} ⏰ ${exam.time || 'any time'}<br>
                📖 ${escapeHtml(exam.topics || 'No topics added')}</div>
                <button class="delete-btn" data-idx="${idx}">🗑️ Done</button>
            </div>
        `).join('');
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                exams.splice(idx,1);
                saveAll();
            });
        });
    }

    // ----- UPLOAD FILES (store as dataURL for small docs, for PDF we extract simple mock text)
    function storeFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                let contentHint = "";
                let fileType = file.type;
                let name = file.name;
                // For images, we just extract a simple message (since AI would need vision, we simulate by making generic topic)
                if(fileType.startsWith('image/')) {
                    contentHint = `[Image: ${name}] – Look at this picture for revision. Try to describe or explain what you see.`;
                } else if(fileType === 'application/pdf') {
                    contentHint = `[PDF document: ${name}] – This PDF has important study info. Read through and practice main ideas.`;
                } else {
                    contentHint = `[File: ${name}] – Review this material.`;
                }
                const fileRecord = {
                    id: Date.now() + Math.random(),
                    name: name,
                    type: fileType,
                    dataURL: e.target.result, // stores image/pdf base64 (can be large, but fine for small files)
                    extractedText: contentHint
                };
                uploadedFilesMeta.push(fileRecord);
                // auto generate a revision note from this file
                revisionItems.push({
                    text: `📎 From "${name}": ${contentHint.substring(0,200)}. Create 1 question: What is the main topic?`,
                    type: 'auto-note',
                    source: name,
                    timestamp: Date.now()
                });
                saveAll();
                resolve();
            };
            reader.readAsDataURL(file);
        });
    }

    async function handleFiles(files) {
        for(let file of files) {
            if(file.size > 2 * 1024 * 1024) { // 2MB limit for local storage comfort
                alert(`${file.name} is large >2MB, but we'll try. For better speed use <2MB.`);
            }
            await storeFile(file);
        }
        renderUploadedFiles();
        renderAutoNotesAndQuestions();
    }

    function renderUploadedFiles() {
        const container = document.getElementById('uploadedFilesList');
        if(!container) return;
        if(uploadedFilesMeta.length === 0) {
            container.innerHTML = '<div>✨ No files uploaded yet. Add your worksheet/notes PDF or image!</div>';
            return;
        }
        container.innerHTML = uploadedFilesMeta.map((f, idx) => `
            <div class="exam-item" style="justify-content:space-between;">
                <span>📄 ${escapeHtml(f.name)} (${f.type.split('/')[1] || 'file'})</span>
                <button class="delete-file" data-id="${f.id}">❌ Remove</button>
            </div>
        `).join('');
        document.querySelectorAll('.delete-file').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseFloat(btn.dataset.id);
                uploadedFilesMeta = uploadedFilesMeta.filter(f => f.id !== id);
                // also remove revision items linked to that file
                revisionItems = revisionItems.filter(r => r.source !== (uploadedFilesMeta.find(f=>f.id===id)?.name));
                saveAll();
            });
        });
    }

    // generate notes/questions from all files using a smart kid-friendly extraction
    function generateSmartContentFromFiles() {
        if(uploadedFilesMeta.length === 0) {
            alert("Please upload some images or PDFs first!");
            return;
        }
        let newNotesCount = 0;
        uploadedFilesMeta.forEach(file => {
            let baseMessage = file.extractedText || `Study content: ${file.name}`;
            // create 2-3 revision prompts
            const question1 = `❓ Question from ${file.name}: What is one key fact you remember?`;
            const note1 = `📘 Revision note: Look at ${file.name} and try to explain it to a friend.`;
            const question2 = `❓ Challenge: Write down 3 words from ${file.name} that are important.`;
            // avoid duplicates: check if we already have similar
            const alreadyHas = revisionItems.some(r => r.text.includes(file.name) && r.text.includes("key fact"));
            if(!alreadyHas) {
                revisionItems.push({ text: question1, type: 'question', source: file.name, timestamp: Date.now() });
                revisionItems.push({ text: note1, type: 'note', source: file.name, timestamp: Date.now() });
                revisionItems.push({ text: question2, type: 'question', source: file.name, timestamp: Date.now() });
                newNotesCount += 3;
            }
        });
        saveAll();
        alert(`✨ Generated ${newNotesCount} new study questions + notes from your files! Go to "Quiz Me" tab.`);
    }

    function renderAutoNotesAndQuestions() {
        const container = document.getElementById('autoNotesList');
        if(!container) return;
        const recent = revisionItems.slice(-8).reverse();
        container.innerHTML = recent.map(r => `<div class="question-box">📌 ${escapeHtml(r.text)} <span style="font-size:0.7rem;">(${r.source || 'study'})</span></div>`).join('');
        if(recent.length === 0) container.innerHTML = '<div>💡 Upload a file & click "Generate notes" → they appear here!</div>';
    }

    function renderAllRevisionContent() {
        const container = document.getElementById('allRevisionContent');
        if(!container) return;
        if(revisionItems.length === 0) {
            container.innerHTML = '<div class="card">📭 No notes or Qs yet. Upload a picture of your workbook!</div>';
            return;
        }
        container.innerHTML = revisionItems.slice().reverse().map(r => `
            <div class="question-box">
                <strong>${r.type === 'question' ? '🧠 QUIZ:' : '📘 NOTE:'}</strong> ${escapeHtml(r.text)}
                <div style="font-size:12px; opacity:0.7;">📎 ${r.source || 'general'}</div>
                <button class="removeRevisionBtn" data-ts="${r.timestamp}" style="background:#e67e22; padding:4px 12px; margin-top:8px;">🗑️ remove</button>
            </div>
        `).join('');
        document.querySelectorAll('.removeRevisionBtn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const ts = parseInt(btn.dataset.ts);
                revisionItems = revisionItems.filter(r => r.timestamp !== ts);
                saveAll();
            });
        });
    }

    // RANDOM QUIZ
    function showRandomQuiz() {
        const quizDiv = document.getElementById('quizDisplay');
        const questionsOnly = revisionItems.filter(r => r.type === 'question' || r.text.includes('❓') || r.text.includes('Question'));
        if(questionsOnly.length === 0) {
            quizDiv.innerHTML = '<div class="question-box">🎯 No quiz questions yet. Upload a study PDF/image and click "✨ Generate notes & questions"! 🎯</div>';
            return;
        }
        const randomQ = questionsOnly[Math.floor(Math.random() * questionsOnly.length)];
        quizDiv.innerHTML = `
            <div class="question-box" style="background:#ffd9b5;">
                <div style="font-size:1.7rem;">🎲 Pop quiz!</div>
                <p style="font-size:1.2rem;"><strong>${escapeHtml(randomQ.text)}</strong></p>
                <p>💡 Say your answer out loud or write it down! Then click another quiz.</p>
                <button id="nextQuizBtn" style="background:#f39c12;">🎉 Next question</button>
            </div>
        `;
        document.getElementById('nextQuizBtn')?.addEventListener('click', showRandomQuiz);
    }

    // ----- HELPERS & EVENT LISTENERS -----
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});}

    // TABS
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active-panel'));
            const targetId = tab.dataset.tab + 'Panel';
            document.getElementById(targetId).classList.add('active-panel');
        });
    });

    // Add exam
    document.getElementById('saveExamBtn')?.addEventListener('click', () => {
        const subject = document.getElementById('subjectName').value.trim();
        const date = document.getElementById('examDate').value;
        const time = document.getElementById('examTime').value;
        const topics = document.getElementById('topicsList').value.trim();
        if(!subject) { alert("Please add a subject name!"); return; }
        exams.push({ subject, date, time, topics });
        saveAll();
        document.getElementById('subjectName').value = '';
        document.getElementById('topicsList').value = '';
    });

    // File upload logic
    const fileInput = document.getElementById('fileInput');
    document.getElementById('chooseFileBtn')?.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(Array.from(e.target.files)));
    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.background = '#ffe0b5'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.background = '#fff5e8'; });
    dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.style.background = '#fff5e8'; const files = Array.from(e.dataTransfer.files); handleFiles(files); });

    document.getElementById('generateFromFilesBtn')?.addEventListener('click', generateSmartContentFromFiles);
    document.getElementById('generateRandomQuizBtn')?.addEventListener('click', showRandomQuiz);

    // initial render
    renderExamList();
    renderUploadedFiles();
    renderAutoNotesAndQuestions();
    renderAllRevisionContent();

    // extra fun: load sample tip
    if(exams.length === 0 && uploadedFilesMeta.length === 0) {
        setTimeout(() => {
            if(confirm("👋 Want a quick demo? Add a fake exam or upload any picture to see magic!")) {
                // optional sample to show features
            }
        }, 400);
    }
</script>
</body>
</html>
